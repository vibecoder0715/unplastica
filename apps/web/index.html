    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; media-src 'self' blob:; object-src 'none'; base-uri 'self';" />

    <link rel="icon" type="image/png" href="/assets/brand/brand-mark-light.png?v=0.2.4" />
    <link rel="manifest" href="/manifest.webmanifest?v=0.2.4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Unplastica — Play to reduce plastic in Malaysia</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem("unplastica-theme") || localStorage.getItem("theme") || "system";
          var isDark = t === "dark" || (t === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--surface, #fafaed);
      }
      :root[data-theme="dark"], html[data-theme="dark"], body[data-theme="dark"] {
        background-color: #0c1410 !important;
        color-scheme: dark;
      }
      :root[data-theme="light"], html[data-theme="light"], body[data-theme="light"] {
        background-color: #fafaed !important;
        color-scheme: light;
      }
      .pwa-launch-splash {
        min-height: 100dvh;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        width: 100%;
        padding: 24px;
        box-sizing: border-box;
      }
      .pwa-launch-wordmark {
        width: 220px;
        height: auto;
        max-width: 75vw;
        object-fit: contain;
        background: transparent;
        display: block;
      }
      .pwa-wordmark-light { display: block; }
      .pwa-wordmark-dark { display: none; }
      :root[data-theme="dark"] .pwa-wordmark-light { display: none !important; }
      :root[data-theme="dark"] .pwa-wordmark-dark { display: block !important; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .pwa-wordmark-light { display: none !important; }
        :root:not([data-theme="light"]) .pwa-wordmark-dark { display: block !important; }
      }
    </style>
    <script>
      (function() {
        var APP_VER = "0.2.2";
        try {
          var stored = localStorage.getItem("unplastica_app_version");
          if (stored !== APP_VER) {
            localStorage.setItem("unplastica_app_version", APP_VER);
            if (stored && "serviceWorker" in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) regs[i].unregister();
              });
              if ("caches" in window) {
                caches.keys().then(function(keys) {
                  for (var j = 0; j < keys.length; j++) caches.delete(keys[j]);
                });
              }
            }
          }
          var storedTheme = localStorage.getItem("unplastica-theme") || localStorage.getItem("theme");
          var isDark = storedTheme === "dark" || ((!storedTheme || storedTheme === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="pwa-launch-splash">
        <img class="pwa-launch-wordmark pwa-wordmark-light" src="/assets/brand/brand-wordmark-light.png" alt="unplastica" />
        <img class="pwa-launch-wordmark pwa-wordmark-dark" src="/assets/brand/brand-wordmark-dark.png" alt="unplastica" />
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.min.js" integrity="sha384-ptI8iyyOcINc8kC8ZGnLexw29V7PfIaX46b1GMjaX2QKGvUPH8Jrp5U81Mh4TDp4" crossorigin="anonymous"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
