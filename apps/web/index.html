    <script>
      (function() {
        try {
          var t = localStorage.getItem("unplastica-theme") || localStorage.getItem("theme") || "system";
          var isDark = t === "dark" || (t === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #ffffff;
      }
      .pwa-launch-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        min-height: 100dvh;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        width: 100%;
        padding: 24px;
        box-sizing: border-box;
      }
      html[data-theme="dark"] .pwa-launch-splash {
        background: #0b1315;
      }
      .pwa-dotted-spinner {
        color: #16a34a;
        overflow: visible;
      }
      html[data-theme="dark"] .pwa-dotted-spinner {
        color: #4ade80;
      }
      .pwa-dotted-spinner-group {
        transform-origin: 50% 50%;
        animation: pwa-dotted-spin 1.1s linear infinite;
      }
      @keyframes pwa-dotted-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      (function() {
        var APP_VER = "0.7.0";
        try {
          var stored = localStorage.getItem("unplastica_app_version");
          if (stored !== APP_VER) {
            localStorage.setItem("unplastica_app_version", APP_VER);
            if ("serviceWorker" in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) regs[i].unregister();
              });
            }
            if ("caches" in window) {
              caches.keys().then(function(keys) {
                for (var j = 0; j < keys.length; j++) caches.delete(keys[j]);
              });
            }
            if (typeof fetch === "function") {
              fetch("/api/clear-cache", { method: "POST", cache: "no-store" }).catch(function() {});
            }
          }
          var storedTheme = localStorage.getItem("unplastica-theme") || localStorage.getItem("theme");
          var isDark = storedTheme === "dark" || ((!storedTheme || storedTheme === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
        } catch (_) {}
      })();
    </script>
