<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaed" />
    <title>Offline — Unplastica</title>
    <style>
      :root { color-scheme: light; font-family: "Space Grotesk", Arial, sans-serif; background: #fafaed; color: #002c17; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; padding: max(2rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom)); display: grid; place-items: center; text-align: center; }
      main { width: min(100%, 32rem); }
      img { width: min(9rem, 42vw); margin-bottom: 2rem; }
      h1 { font: 800 clamp(2rem, 8vw, 3rem)/1.05 Outfit, Arial, sans-serif; margin: 0 0 1rem; }
      p { font-size: 1rem; line-height: 1.6; color: #414942; }
      button { border: 0; border-radius: 999px; padding: .9rem 1.4rem; margin-top: .8rem; background: #15432a; color: white; font: 700 1rem Outfit, Arial, sans-serif; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <picture>
        <source srcset="/assets/brand/brand-wordmark-dark.png" media="(prefers-color-scheme: dark)" />
        <img src="/assets/brand/brand-wordmark-light.png" alt="Unplastica" style="width: 200px; height: auto; max-width: 60vw;" />
      </picture>
      <h1>You’re offline</h1>
      <p>Your connection is taking a break. Your Greenbits, scans, and account details are never saved on this device for offline use.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
