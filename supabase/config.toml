project_id = "unplastica"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "https://unplastica.vercel.app"
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:5173/login", "https://unplastica.vercel.app/**", "https://unplastica.vercel.app/login"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true

[functions.create-proof-upload]
verify_jwt = true

[functions.verify-scan]
verify_jwt = true

[functions.spend-greenbits]
verify_jwt = true

[functions.redeem-voucher]
verify_jwt = true

[functions.sign-in]
verify_jwt = false

[functions.welcome-bonus]
verify_jwt = true

[functions.upload-profile-avatar]
verify_jwt = true

[functions.flag-anomalies]
verify_jwt = false

[functions.purge-expired-media]
verify_jwt = false

